<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
    <title>Block Dodger - Ape Arcade</title>
    <link rel="stylesheet" href="../shared/css/arcade-viewport.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Debug utility - must load first -->
    <script src="../shared/js/debug.js"></script>
    <script src="../shared/js/arcade-config.js"></script>
    <script src="../shared/js/arcade-device.js"></script>
    
    <!-- Core systems -->
    <!-- Loading Screen System -->
    <script src="../shared/js/loading-screen.js"></script>
    <!-- Secure Database Wrapper -->
    <script src="../shared/js/secure-db.js"></script>
    <!-- Web3.js for Ethereum interaction -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.2/dist/web3.min.js"></script>
    <!-- ethers.js as an alternative library -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <!-- Supabase client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- SoundCloud API -->
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <!-- Arcade profile bootstrap (no access guard) -->
    <script src="../shared/js/wallet-guard.js?v=8"></script>
    <!-- Game scripts have been moved to the end of body -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        html {
            overflow: hidden;
            height: 100%;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            max-height: 100dvh;
            background: #000000;
            font-family: 'Press Start 2P', cursive, Arial, sans-serif;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 255, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.08) 0%, transparent 25%);
            overflow: hidden; /* Prevent all scrolling */
            width: 100%;
            box-sizing: border-box;
        }

        /* Wrapper div to center the game container */
        .game-container-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 600px;
            max-height: 600px; /* Fixed maximum height */
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
            padding: 0;
            margin: 0 auto;
            border: 4px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7), 
                        0 0 40px rgba(0, 255, 255, 0.3), 
                        inset 0 0 15px rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            aspect-ratio: 2/3; /* Maintain aspect ratio */
            left: 0; /* Reset any left positioning */
            right: 0; /* Ensure it's centered */
            box-sizing: border-box;
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ffff;
            font-size: 22px;
            z-index: 5;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
            margin: 10px 0;
            font-family: 'Press Start 2P', cursive;
            letter-spacing: 1px;
        }

        #gameCanvas {
            position: absolute;
            background: #000;
            display: block;
            margin: 0;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        #gameScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            overflow: hidden;
        }

        #menuScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 255, 255, 0.05) 25%, rgba(0, 255, 255, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, 0.05) 75%, rgba(0, 255, 255, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 255, 0.05) 25%, rgba(0, 255, 255, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, 0.05) 75%, rgba(0, 255, 255, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px 20px;
            overflow-y: auto;
            overflow-x: hidden;
            pointer-events: auto;
            box-sizing: border-box;
            text-align: center;
        }

        #menuScreen h1 {
            color: #ffffff;
            font-size: clamp(24px, 7vw, 46px);
            margin-bottom: clamp(15px, 5dvh, 35px);
            margin-top: clamp(0px, 2dvh, 10px);
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7),
                         0 0 20px rgba(0, 255, 255, 0.5),
                         0 0 30px rgba(0, 255, 255, 0.3);
            animation: titleGlow 2s ease-in-out infinite alternate;
            line-height: 1.3;
            text-align: center;
            letter-spacing: 2px;
            position: relative;
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            word-break: break-word;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            left: 0;
            right: 0;
            margin-left: auto;
            margin-right: auto;
        }
        
        #menuScreen h1::before {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
        }

        .menu-button {
            background: rgba(0, 0, 0, 0.7);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: clamp(8px, 3vw, 14px) clamp(15px, 5vw, 25px);
            margin: clamp(5px, 1.5dvh, 10px) auto;
            font-size: clamp(12px, 3vw, 16px);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 0 5px #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4),
                        inset 0 0 5px rgba(0, 255, 255, 0.2);
            width: clamp(180px, 60%, 280px);
            max-width: 280px;
            text-align: center;
            display: block;
            position: relative;
            z-index: 1001;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            min-height: 44px;
            min-width: 180px;
            white-space: normal;
            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
            font-family: 'Press Start 2P', cursive;
            letter-spacing: 1px;
            line-height: 1.4;
            overflow: visible;
            box-sizing: border-box;
            left: 0 !important; /* Force left position to be 0 */
            right: 0 !important; /* Force right position to be 0 */
        }

        .menu-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .menu-button:hover::after {
            left: 100%;
        }

        .menu-button:hover {
            background: rgba(0, 255, 255, 0.15);
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7),
                        inset 0 0 10px rgba(0, 255, 255, 0.4);
            transform: translateY(-2px);
            border-color: #ffffff;
        }

        .menu-button:active {
            background: rgba(0, 255, 255, 0.3);
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
            transform: translateY(1px);
        }

        #notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            display: none;
            z-index: 20;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        #mobileControls {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 100dvh;
            z-index: 5;
            pointer-events: none;
        }

        #leftTouchArea, #rightTouchArea {
            width: 50%;
            height: 100%;
            position: absolute;
            top: 0;
            pointer-events: auto;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            background: transparent !important;
        }

        #leftTouchArea {
            left: 0;
        }

        #rightTouchArea {
            right: 0;
        }

        #leftTouchArea:active, #rightTouchArea:active {
            background: transparent !important;
        }

        #leaderboardModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .leaderboard-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            padding: clamp(15px, 4vw, 25px);
            border-radius: 10px;
            color: #00ffff;
            width: clamp(280px, 90%, 600px);
            max-height: 85dvh;
            overflow-y: auto;
            border: 3px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6),
                       0 0 30px rgba(0, 255, 255, 0.3),
                       inset 0 0 10px rgba(0, 255, 255, 0.2);
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
            z-index: 1001;
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(10px, 2.5vw, 14px);
        }

        .close-button {
            display: none; /* Hide all close buttons */
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #00ffff;
            font-size: 24px;
            cursor: pointer;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .close-button:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            transform: scale(1.1);
        }

        #leaderboardTitle {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 15px;
        }
        
        #leaderboardTitle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
        }

        .leaderboard-content table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 12px;
        }

        .leaderboard-content th {
            background: rgba(0, 255, 255, 0.15);
            color: #00ffff;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #00ffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        .leaderboard-content td {
            padding: 10px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
        }

        .leaderboard-content tr:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        /* Highlighted row for current user */
        .current-user {
            background: rgba(0, 255, 255, 0.2) !important; 
            font-weight: bold;
        }
        
        .current-user td {
            color: #ffffff !important;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.8) !important;
        }

        /* Buttons */
        button {
            background: rgba(0, 0, 0, 0.7);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            min-height: 44px;
            min-width: 44px;
            position: relative;
            z-index: 1000;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
        }

        button:hover, button:active {
            background: rgba(0, 255, 255, 0.15);
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
        }

        /* Game Over Screen */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.5s ease-out;
            overflow-y: auto;
            box-sizing: border-box;
            text-align: center;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #gameOverScreen h2 {
            color: #00ffff;
            font-size: clamp(28px, 6vw, 42px);
            margin-bottom: clamp(10px, 3dvh, 20px);
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7),
                         0 0 20px rgba(0, 255, 255, 0.4);
            font-family: 'Press Start 2P', cursive;
            letter-spacing: 2px;
            text-align: center;
        }

        #finalScore {
            color: #fff;
            font-size: clamp(18px, 4vw, 32px);
            margin-bottom: clamp(20px, 5dvh, 30px);
            font-family: 'Press Start 2P', cursive;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            text-align: center;
        }

        /* NFT Selection Screen Styles */
        #nftSelectionScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 255, 255, 0.03) 25%, rgba(0, 255, 255, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, 0.03) 75%, rgba(0, 255, 255, 0.03) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 255, 0.03) 25%, rgba(0, 255, 255, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, 0.03) 75%, rgba(0, 255, 255, 0.03) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        #nftSelectionScreen h2 {
            color: #00ffff;
            font-size: clamp(24px, 5vw, 32px);
            margin-bottom: clamp(10px, 3dvh, 20px);
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7),
                         0 0 20px rgba(0, 255, 255, 0.4);
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            letter-spacing: 1px;
        }

        #nftContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .ape-item {
            width: 120px;
            height: 120px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .ape-item:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
            border-color: #ffffff;
        }

        .ape-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ape-item .token-id {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffff;
            text-align: center;
            padding: 5px;
            font-size: 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
        }

        /* Animation keyframes */
        @keyframes titleGlow {
            0% {
                text-shadow: 0 0 10px rgba(0, 255, 255, 0.7),
                             0 0 20px rgba(0, 255, 255, 0.5),
                             0 0 30px rgba(0, 255, 255, 0.3);
            }
            100% {
                text-shadow: 0 0 15px rgba(0, 255, 255, 0.9),
                             0 0 25px rgba(0, 255, 255, 0.7),
                             0 0 35px rgba(0, 255, 255, 0.5);
            }
        }

        /* Media queries for responsiveness */
        @media (max-width: 768px) {
            #gameContainer {
                width: 95%;
                max-width: 90vw;
                height: auto;
                border: 3px solid #00ffff;
                border-radius: 8px;
                aspect-ratio: 2/3;
            }
            
            .leaderboard-content table {
                font-size: 10px;
            }
            
            .leaderboard-content th,
            .leaderboard-content td {
                padding: 8px;
            }
            
            #nftContainer {
                gap: 10px;
                padding: 10px;
            }
            
            .ape-item {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            #gameContainer {
                width: 95%;
                max-width: 95vw;
                max-height: 80dvh;
                border-radius: 5px;
            }
            
            #score {
                font-size: 14px;
                right: 10px;
                top: 10px;
            }
            
            .ape-item {
                width: 80px;
                height: 80px;
            }
            
            .ape-item .token-id {
                font-size: 8px;
                padding: 3px;
            }
            
            .close-button {
                font-size: 20px;
                top: 5px;
                right: 5px;
            }
        }

        /* For very small screens */
        @media (max-height: 600px) {
            #menuScreen {
                justify-content: flex-start;
                padding-top: 10px;
            }
            
            #menuScreen h1 {
                font-size: clamp(20px, 5vw, 28px);
                margin-bottom: 10px;
            }
            
            .menu-button {
                padding: 8px 15px;
                margin: 4px;
                min-height: 36px;
            }
            
            #gameOverScreen h2 {
                font-size: 22px;
                margin-bottom: 10px;
            }
        }

        /* For landscape orientation on mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            #gameContainer {
                max-height: 95dvh;
                max-width: 65dvh;
                aspect-ratio: 2/3;
            }
            
            #menuScreen {
                justify-content: flex-start;
                padding: 10px 5px;
                overflow-y: auto;
            }
            
            #menuScreen h1 {
                font-size: clamp(18px, 5dvh, 24px);
                margin: 5px 0 10px;
            }
            
            .menu-button {
                padding: 5px 15px;
                margin: 3px auto;
                font-size: 12px;
                width: 180px;
                min-height: 36px;
            }
            
            #nftSelectionScreen {
                padding: 10px;
            }
            
            #nftContainer {
                max-height: 300px;
            }
        }
        
        /* SoundCloud iframe styling */
        #soundcloud-player {
            position: fixed;
            bottom: -200px;
            left: 0;
            width: 100%;
            height: 166px;
            z-index: -1;
            border: none;
            outline: none;
        }

        /* Desktop improvements - constrained to 400x600 max */
        @media (min-width: 769px) {
            #gameContainer {
                max-width: 400px;
                width: 400px;
                height: 600px;
                max-height: 600px;
                border-width: 4px;
            }
            
            #gameCanvas {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            
            #menuScreen h1 {
                font-size: clamp(28px, 5vw, 36px);
                margin-bottom: 25px;
            }
            
            .menu-button {
                font-size: 14px;
                padding: 12px 20px;
                margin: 8px auto;
                width: 250px;
                max-width: 280px;
                min-height: 50px;
                line-height: 1.3;
            }
            
            /* Game UI elements improvements for desktop */
            #score {
                font-size: 22px;
                right: 20px;
                top: 20px;
            }
            
            .close-button {
                font-size: 24px;
                top: 10px;
                right: 10px;
            }
            
            /* Shop and modal improvements for desktop */
            .shop-content, 
            .leaderboard-content {
                width: 500px;
                max-width: 80%;
                padding: 30px;
            }
            
            /* Game over screen improvements */
            #gameOverScreen h2 {
                font-size: 36px;
                margin-bottom: 20px;
            }
            
            #finalScore {
                font-size: 24px;
                margin-bottom: 25px;
            }
        }

        #shopModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        /* Standalone close button in shop modal */
        #shopCloseBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            font-size: 32px;
            line-height: 42px;
            z-index: 1003;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
        }

        .shop-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            padding: clamp(15px, 4vw, 25px);
            border-radius: 10px;
            color: #00ffff;
            width: clamp(280px, 90%, 600px);
            max-height: 85dvh;
            overflow-y: auto;
            border: 3px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6),
                       0 0 30px rgba(0, 255, 255, 0.3),
                       inset 0 0 10px rgba(0, 255, 255, 0.2);

    <script>
        // Check if wallet is connected from arcade
        document.addEventListener('DOMContentLoaded', function() {
            const storedWallet =
                typeof window.getArcadeWalletForDatabase === 'function'
                    ? window.getArcadeWalletForDatabase()
                    : '';
            
            if (!storedWallet) {
                console.warn('No Glyph wallet detected yet; staying on page and waiting for sync.');
                return;
            }
            
            // Add keyboard event listener for Escape key to close modals
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    // Close shop modal if open
                    const shopModal = document.getElementById('shopModal');
                    if (shopModal && shopModal.style.display === 'block') {
                        closeShop();
                    }
                }
            });
            
            // Get selected ape from localStorage
            const selectedApe = localStorage.getItem('selectedApe');
            if (selectedApe) {
                try {
                    const apeData = JSON.parse(selectedApe);
                    if (apeData.image) {
                        // Set selected ape in game
                        window.selectedApe = apeData;
                        
                        // If Player module has a setApe function, use it
                        if (window.Player && typeof window.Player.setApe === 'function') {
                            window.Player.setApe(apeData);
                        }
                    }
                } catch (e) {
                    console.error('Error parsing selected ape:', e);
                }
            }
        });
