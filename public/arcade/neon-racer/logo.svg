<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="100" rx="10" fill="#000" />
  
  <!-- Glow effects -->
  <filter id="magentaGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur" />
    <feFlood flood-color="#ff00ff" flood-opacity="0.7" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="glow"/>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  
  <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2" result="blur" />
    <feFlood flood-color="#00ffff" flood-opacity="0.7" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="glow"/>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  
  <!-- Grid lines for retro effect -->
  <g stroke="#ff00ff" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="20" x2="400" y2="20" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="80" x2="400" y2="80" />
    
    <line x1="50" y1="0" x2="50" y2="100" />
    <line x1="100" y1="0" x2="100" y2="100" />
    <line x1="150" y1="0" x2="150" y2="100" />
    <line x1="200" y1="0" x2="200" y2="100" />
    <line x1="250" y1="0" x2="250" y2="100" />
    <line x1="300" y1="0" x2="300" y2="100" />
    <line x1="350" y1="0" x2="350" y2="100" />
  </g>
  
  <!-- Car icon -->
  <g transform="translate(40, 50)" filter="url(#cyanGlow)">
    <!-- Car body -->
    <rect x="0" y="-15" width="40" height="30" rx="5" fill="#222" stroke="#00ffff" stroke-width="2"/>
    <!-- Windows -->
    <rect x="10" y="-12" width="20" height="8" rx="2" fill="#00ffff" opacity="0.7"/>
    <!-- Wheels -->
    <circle cx="10" cy="20" r="8" fill="#333" stroke="#00ffff" stroke-width="1"/>
    <circle cx="30" cy="20" r="8" fill="#333" stroke="#00ffff" stroke-width="1"/>
    <!-- Headlights -->
    <circle cx="3" cy="-5" r="3" fill="#ffff00" filter="url(#cyanGlow)"/>
    <circle cx="37" cy="-5" r="3" fill="#ffff00" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Main text -->
  <text x="100" y="60" fill="#fff" font-family="'Orbitron', sans-serif" font-size="42" font-weight="bold" filter="url(#magentaGlow)">
    NEON RACER
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="85" fill="#00ffff" font-family="'Orbitron', sans-serif" font-size="12" text-anchor="middle" filter="url(#cyanGlow)">
    CYBERPUNK RACING GAME
  </text>
  
  <!-- Motion lines -->
  <g stroke="#ff00ff" stroke-width="1.5" stroke-linecap="round">
    <line x1="10" y1="50" x2="25" y2="50" stroke-dasharray="2,4" />
    <line x1="5" y1="60" x2="30" y2="60" stroke-dasharray="2,4" />
    <line x1="10" y1="70" x2="25" y2="70" stroke-dasharray="2,4" />
  </g>
</svg> 